name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:chrome
      - run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-evidence
          path: |
            evidence/
            test-results/
