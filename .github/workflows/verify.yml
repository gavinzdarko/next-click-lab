name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npm run format:check
      - run: npm run check
      - run: xvfb-run -a npm run verify:chrome
        env:
          HEADED: "1"
      - run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-evidence
          path: |
            evidence/
            test-results/
